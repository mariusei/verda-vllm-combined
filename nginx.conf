worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }

http {
  access_log /dev/stdout;

  # vLLM kald start + lange genereringer → romslige timeouts.
  # buffering av for SSE/streaming; HTTP/1.1 + tom Connection for keepalive til upstream.
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_connect_timeout 75s;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  client_max_body_size 50m;          # OCR-bilder kan være store (base64)

  server {
    listen 8000;

    # Readiness: 200 når LLM-serveren svarer. Verda healthcheck (port 8000, path /health) peker hit.
    # (Chandra/OCR gates IKKE av denne — laster 60 s senere; OCR-kall før den er klar gir 502 → retry.)
    location = /health { proxy_pass http://127.0.0.1:8001/health; }

    # Tekst-LLM (Qwen3-14B-AWQ). Trailing slash på proxy_pass stripper /llm/-prefikset.
    #   <base>/llm/v1/chat/completions → 127.0.0.1:8001/v1/chat/completions
    location /llm/ { proxy_pass http://127.0.0.1:8001/; }

    # VLM/OCR (Chandra-2).  <base>/ocr/v1/chat/completions → 127.0.0.1:8002/v1/chat/completions
    location /ocr/ { proxy_pass http://127.0.0.1:8002/; }
  }
}
