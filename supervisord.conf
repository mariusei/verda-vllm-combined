[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; --- Tekst-LLM: Qwen3-14B-AWQ (4-bit) på intern port 8001 ---
[program:vllm-llm]
command=vllm serve Qwen/Qwen3-14B-AWQ --quantization awq_marlin --max-model-len 8192 --gpu-memory-utilization 0.50 --host 127.0.0.1 --port 8001
autostart=true
autorestart=true
startretries=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- VLM/OCR: Chandra-2 på intern port 8002 ---
; Starter ETTER LLM-en (sleep 60) så Qwen rekker å reservere sin VRAM-andel
; før Chandra kjører sin memory-profiling → unngår oppstarts-race/OOM på delt GPU.
[program:vllm-ocr]
command=bash -lc 'sleep 60; exec vllm serve datalab-to/chandra-ocr-2 --trust-remote-code --max-model-len 16384 --max-num-seqs 2 --gpu-memory-utilization 0.35 --host 127.0.0.1 --port 8002'
autostart=true
autorestart=true
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Ruter: nginx på exposed port 8000 ---
[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
